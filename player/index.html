<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>taly // Dracula</title>
<style>
:root{color-scheme:dark;--bg:#0b0d0e;--panel:#111414;--panel2:#161919;--line:#2c302e;--text:#ebe7d9;--muted:#858a82;--yellow:#f0d455;--fire:#b55d32;--smoke:#a2ada6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:grid;place-items:center;padding:24px}.shell{width:min(1080px,100%);border:1px solid var(--line);background:var(--panel);box-shadow:0 24px 70px #0007}.top{height:43px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--yellow);margin-right:8px}.accent{height:2px;background:linear-gradient(90deg,var(--fire),var(--yellow),var(--smoke));opacity:.65}.layout{display:grid;grid-template-columns:minmax(310px,.9fr) minmax(360px,1.1fr);min-height:610px}.deck{padding:34px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px;justify-content:space-between}.turntable{position:relative;width:min(100%,420px);aspect-ratio:1;margin:auto;background:#0f1213;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.platter{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:#222625;box-shadow:0 13px 26px #0006}.record{position:relative;width:74%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:repeating-radial-gradient(circle,#090a0a 0 4px,#171919 5px 6px,#090a0a 7px 12px);border:1px solid #292c2b;animation:spin 2.35s linear infinite;will-change:transform}.record:focus-visible{outline:2px solid var(--yellow);outline-offset:4px}@keyframes spin{to{transform:rotate(360deg)}}.label{position:relative;width:34%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:1px solid #ffffff18;background:#5e6257}.label img{width:100%;height:100%;display:block;object-fit:cover}.label:after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);border:1px solid #ffffff22}.base{position:absolute;width:38px;height:38px;right:12%;top:10%;border-radius:50%;border:1px solid #454a47;background:#1a1d1d;z-index:5}.arm{position:absolute;width:7px;height:46%;right:calc(12% + 15px);top:calc(10% + 19px);border-radius:8px;background:#8c918c;transform-origin:50% 0;transform:rotate(-28deg);transition:transform .4s ease;z-index:4}.arm:after{content:"";position:absolute;bottom:-5px;left:50%;width:18px;height:13px;transform:translateX(-50%);background:#343837;border:1px solid #555b57}.turntable.playing .arm{transform:rotate(-12deg)}.eyebrow{color:var(--yellow);font-size:11px;letter-spacing:.14em;text-transform:uppercase}h1{margin:5px 0 0;font-size:clamp(32px,5vw,54px);line-height:.95;letter-spacing:-.045em;font-weight:650}.artist{color:var(--muted);margin-top:8px;font-size:13px}.controls{display:grid;gap:12px}.transport{display:flex;align-items:center;gap:14px}.play{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:var(--yellow);color:var(--bg);cursor:pointer;font-size:17px}.time{min-width:112px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;color:var(--muted);font-size:11px}input[type=range]{width:100%;accent-color:var(--yellow)}.load{display:inline-flex;width:max-content;padding:7px 9px;border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:11px}.load input{display:none}.source{min-height:16px;color:#737873;font-size:10px;line-height:1.5}.lyrics-panel{min-width:0;display:grid;grid-template-rows:54px 1fr 44px;background:#101313}.lyrics-head,.lyrics-foot{padding:0 22px;display:flex;align-items:center;justify-content:space-between}.lyrics-head{border-bottom:1px solid var(--line)}.lyrics-head strong{color:var(--smoke);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}.lyrics-head span,.lyrics-foot{color:#656a64;font-size:10px}.lyrics-foot{border-top:1px solid var(--line)}.lyrics{position:relative;overflow-y:auto;scroll-behavior:smooth;padding:260px 32px;scrollbar-width:thin;scrollbar-color:#313633 transparent;mask-image:linear-gradient(to bottom,transparent,#000 13%,#000 87%,transparent)}.line{border:0;width:100%;text-align:left;background:transparent;color:#666b63;padding:10px 0;cursor:pointer;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-style:italic;font-weight:300;font-size:clamp(17px,2.3vw,25px);line-height:1.22;letter-spacing:-.018em;opacity:.55;transition:.18s}.line:hover{color:#aaa99f;opacity:.85}.line.near{color:#989b91;opacity:.78}.line.active{color:var(--yellow);opacity:1;transform:translateX(5px)}.line.blank{min-height:24px;color:#8d7834}@media(max-width:820px){body{padding:10px}.layout{grid-template-columns:1fr}.deck{border-right:0;border-bottom:1px solid var(--line);padding:24px}.turntable{width:min(100%,360px)}.lyrics-panel{min-height:500px}}@media(prefers-reduced-motion:reduce){.record{animation-duration:8s}.lyrics{scroll-behavior:auto}*{transition-duration:0s!important}}
</style>
</head>
<body>
<main class="shell"><div class="top"><span>taly@github:~/music $ ./dracula</span><span id="status" class="status">record spinning</span></div><div class="accent"></div><section class="layout">
<div class="deck"><div id="turntable" class="turntable"><div class="platter"></div><div id="record" class="record" role="button" tabindex="0" aria-label="play or pause"><div class="label"><img src="./cover.jpg" alt="Dracula cover"></div></div><div class="base"></div><div class="arm"></div></div><div><div class="eyebrow">now spinning</div><h1>Dracula</h1><div class="artist">Tame Impala · Deadbeat</div></div><div class="controls"><div class="transport"><button id="play" class="play">▶</button><div class="time"><span id="now">0:00</span> / <span id="dur">3:25</span></div></div><div class="row"><span>seek</span><input id="seek" type="range" min="0" max="1000" value="0"></div><div class="row"><span>vol</span><input id="vol" type="range" min="0" max="1" value=".82" step=".01"></div><label class="load">load local audio<input id="file" type="file" accept="audio/*"></label><div id="source" class="source">source: ./Dracula.mp3</div></div></div>
<div class="lyrics-panel"><div class="lyrics-head"><strong>lyrics / synced</strong><span id="ltime">00:00.00</span></div><div id="lyrics" class="lyrics"></div><div class="lyrics-foot"><span>Helvetica Neue · italic 300</span><span>click a line to seek</span></div></div>
</section><audio id="audio" preload="metadata" src="./Dracula.mp3"></audio></main>
<script>
const audio=document.querySelector('#audio'),turntable=document.querySelector('#turntable'),record=document.querySelector('#record'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),vol=document.querySelector('#vol'),file=document.querySelector('#file'),now=document.querySelector('#now'),dur=document.querySelector('#dur'),source=document.querySelector('#source'),status=document.querySelector('#status'),lyricsEl=document.querySelector('#lyrics'),ltime=document.querySelector('#ltime');let lyrics=[],active=-1,obj=null,raf=0;
const fmt=s=>Number.isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';const precise=s=>{if(!Number.isFinite(s))return'00:00.00';return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}.${String(Math.floor((s%1)*100)).padStart(2,'0')}`};
function parseLrc(t){let out=[];for(const raw of t.split(/\r?\n/)){const re=/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\]/g,txt=raw.replace(re,'').trim();let m;while((m=re.exec(raw)))out.push({time:+m[1]*60 + +m[2],text:txt})}return out.sort((a,b)=>a.time-b.time)}
function render(){lyricsEl.replaceChildren();lyrics.forEach((l,i)=>{const b=document.createElement('button');b.className='line'+(l.text?'':' blank');b.textContent=l.text||'· · ·';b.onclick=()=>{audio.currentTime=l.time;if(audio.paused)audio.play().catch(()=>{})};lyricsEl.appendChild(b)})}
function idxAt(t){let lo=0,hi=lyrics.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(lyrics[m].time<=t+.035){r=m;lo=m+1}else hi=m-1}return r}
function syncLyrics(t,force=false){ltime.textContent=precise(t);const n=idxAt(t);if(!force&&n===active)return;active=n;const nodes=lyricsEl.children;for(let i=0;i<nodes.length;i++){nodes[i].classList.toggle('active',i===n);nodes[i].classList.toggle('near',Math.abs(i-n)===1)}if(n>=0&&nodes[n])nodes[n].scrollIntoView({behavior:force?'auto':'smooth',block:'center'});else lyricsEl.scrollTop=0}
function syncState(){const on=!audio.paused&&!audio.ended;turntable.classList.toggle('playing',on);play.textContent=on?'Ⅱ':'▶';status.textContent=on?'playing · record spinning':'record spinning'}async function toggle(){try{audio.paused?await audio.play():audio.pause()}catch{source.textContent='Dracula.mp3 unavailable — vinyl still spins; load a local copy';status.textContent='record spinning · audio unavailable'}}
function frame(){now.textContent=fmt(audio.currentTime);seek.value=audio.duration?Math.round(audio.currentTime/audio.duration*1000):0;syncLyrics(audio.currentTime);if(!audio.paused&&!audio.ended)raf=requestAnimationFrame(frame)}
play.onclick=toggle;record.onclick=toggle;record.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};audio.onplay=()=>{syncState();cancelAnimationFrame(raf);frame()};audio.onpause=()=>{syncState();cancelAnimationFrame(raf);frame()};audio.onended=audio.onpause;audio.onloadedmetadata=()=>{dur.textContent=fmt(audio.duration);frame()};audio.ontimeupdate=()=>{if(audio.paused)frame()};audio.onerror=()=>{source.textContent='Dracula.mp3 not found — vinyl still spins; load a local copy';status.textContent='record spinning · audio unavailable';syncState()};seek.oninput=()=>{if(audio.duration){audio.currentTime=+seek.value/1000*audio.duration;syncLyrics(audio.currentTime,true)}};vol.oninput=()=>audio.volume=+vol.value;audio.volume=+vol.value;file.onchange=()=>{const f=file.files[0];if(!f)return;if(obj)URL.revokeObjectURL(obj);obj=URL.createObjectURL(f);audio.src=obj;audio.load();source.textContent=`source: local / ${f.name}`};
fetch('./Dracula.lrc').then(r=>r.text()).then(t=>{lyrics=parseLrc(t);render();syncLyrics(0,true)}).catch(()=>{lyricsEl.textContent='lyrics unavailable'});syncState();
</script>
</body></html>
