<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>taly / systems</title></head><body><script>fetch('/taly/').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(h=>{h=h.replaceAll('media/','/taly/media/').replaceAll('href="blog/','href="/talystalys/blog/');document.open();document.write(h);document.close()}).catch(e=>{document.body.style.cssText='background:#11100f;color:#eee9df;font:14px monospace;padding:32px';document.body.textContent='portfolio failed to load: '+e.message})</script></body></html>
