<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="t d">
<title id="t">Dracula turntable</title><desc id="d">A continuously spinning vinyl record using the Dracula cover art.</desc>
<defs><clipPath id="clip"><circle cx="128" cy="120" r="24"/></clipPath></defs>
<rect x="1" y="1" width="758" height="218" rx="10" fill="#0b0d0e" stroke="#2c302e"/>
<rect x="1" y="40" width="758" height="2" fill="#b55d32" opacity=".7"/><rect x="230" y="40" width="260" height="2" fill="#f0d455" opacity=".72"/><rect x="490" y="40" width="269" height="2" fill="#a2ada6" opacity=".65"/>
<text x="22" y="26" fill="#858a82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">taly@github:~/music $ ./dracula</text>
<circle cx="716" cy="22" r="4" fill="#f0d455"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
<g><circle cx="128" cy="120" r="76" fill="#222625"/><g><circle cx="128" cy="120" r="69" fill="#090a0a" stroke="#292c2b"/><circle cx="128" cy="120" r="56" fill="none" stroke="#191b1b"/><circle cx="128" cy="120" r="45" fill="none" stroke="#202222"/><image href="https://raw.githubusercontent.com/talystalys/talystalys/main/player/cover.jpg" x="104" y="96" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip)"/><circle cx="128" cy="120" r="4" fill="#0b0d0e"/><animateTransform attributeName="transform" type="rotate" from="0 128 120" to="360 128 120" dur="2.35s" repeatCount="indefinite"/></g></g>
<g transform="translate(202 60) rotate(-17)"><circle r="12" fill="#181b1b" stroke="#4b504d"/><rect x="-3" y="4" width="6" height="86" rx="3" fill="#8c918c"/><rect x="-8" y="84" width="16" height="13" fill="#343837" stroke="#555b57"/></g>
<text x="280" y="88" fill="#f0d455" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2">NOW SPINNING</text>
<text x="280" y="122" fill="#ebe7d9" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="500">Dracula</text>
<text x="280" y="145" fill="#858a82" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13">Tame Impala · Deadbeat</text>
<rect x="280" y="163" width="360" height="4" rx="2" fill="#202423"/><rect x="280" y="163" width="80" height="4" rx="2" fill="#f0d455"><animate attributeName="width" values="30;340;30" dur="18s" repeatCount="indefinite"/></rect>
</svg>